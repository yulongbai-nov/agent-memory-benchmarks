[project]
name = "opensquilla-benchmark"
version = "0.1.0"
description = "OpenSquilla memory-only benchmark adapter."
requires-python = ">=3.13"
dependencies = ["amb"]

[project.entry-points."amb.systems"]
opensquilla = "src.benchmark:OpenSquillaBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"worker/serve.py" = "src/worker.py"
