[project]
name = "openviking-benchmark"
version = "0.1.0"
description = "OpenViking agent memory benchmark adapter."
requires-python = ">=3.13"
dependencies = ["amb", "httpx>=0.27"]

[project.entry-points."amb.systems"]
openviking = "src.benchmark:OpenVikingBenchmark"

[tool.uv.sources]
amb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
