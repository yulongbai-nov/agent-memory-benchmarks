[project]
name = "agent-memory-lab-benchmark"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["amb"]

[project.entry-points."amb.systems"]
agent-memory-lab = "aml_lab_benchmark.adapter:LabBenchmark"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml_lab_benchmark"]
