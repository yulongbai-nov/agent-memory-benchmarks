name: OpenViking end-to-end smoke

on:
  push:
    branches: [codex/openviking-benchmark]
    paths:
      - .github/workflows/openviking-e2e.yml
      - benchmarks/openviking/**
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: Develop
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.TEXT_EMBEDDING_3_SMALL_OPENAI_KEY }}
      OPENVIKING_BENCHMARK_KEY: amb-local-only
      OPENVIKING_BASE_URL: http://127.0.0.1:1933
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.0'
      - name: Record runner hardware
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          cpu = json.loads(subprocess.check_output(['lscpu', '--json']))['lscpu']
          info = {'runner_os': platform.platform(), 'architecture': platform.machine(),
                  'logical_cpus': os.cpu_count(), 'cpu': cpu,
                  'memory': Path('/proc/meminfo').read_text().splitlines()[0],
                  'image_os': os.getenv('ImageOS'), 'image_version': os.getenv('ImageVersion')}
          Path(os.environ['RUNNER_TEMP'], 'runner-info.json').write_text(json.dumps(info, indent=2))
          PY
      - name: Install the benchmark adapter
        run: |
          uv sync --locked --package openviking-benchmark
          uv pip install --no-config --python .venv/bin/python openai==3.49.0
      - name: Create private server configuration
        run: |
          umask 077
          python - <<'PY'
          import json, os
          key = os.environ['OPENAI_API_KEY']
          if not key:
              raise SystemExit('OpenAI key unavailable in the Develop environment')
          config = {
              'server': {'host': '0.0.0.0', 'port': 1933, 'auth_mode': 'trusted', 'root_api_key': os.environ['OPENVIKING_BENCHMARK_KEY']},
              'storage': {'workspace': '/tmp/openviking-benchmark'},
              'embedding': {'dense': {'provider': 'openai', 'model': 'text-embedding-3-small', 'api_key': key, 'dimension': 1536, 'input': 'text'}},
              'vlm': {'provider': 'openai', 'model': 'gpt-6-luna', 'api_key': key, 'reasoning_effort': 'none', 'max_tokens': 2048},
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'openviking-conf.json'), 'w') as file:
              json.dump(config, file)
          PY
      - name: Start isolated OpenViking server
        run: |
          docker run -d --name amb-openviking \
            -p 127.0.0.1:1933:1933 \
            -v "$RUNNER_TEMP/openviking-conf.json:/app/.openviking/ov.conf:ro" \
            ghcr.io/volcengine/openviking@sha256:cd1a62b698c5dd4c2685acf5e3f8b1b543a4c32d25f81dec0ceff23e7a96de9d --without-bot
          for i in $(seq 1 180); do
            if curl -fsS -H "X-API-Key: $OPENVIKING_BENCHMARK_KEY" http://127.0.0.1:1933/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'OpenViking server did not become healthy' >&2
          exit 1
      - name: Ingest and recall a memory
        run: |
          .venv/bin/python - <<'PY'
          from amb.contracts.conversation import Session, Turn
          from src.memory import OpenVikingMemory

          memory = OpenVikingMemory()
          try:
              memory.setup()
              memory.ingest_session('smoke', Session(session_id='one', turns=[
                  Turn(turn_id='1', speaker='Maya', text='I have a pet tortoise named Saffron.')
              ]))
              hits = memory.search('smoke', 'What is Maya’s tortoise named?')
              assert any('saffron' in hit.content.lower() for hit in hits), 'Expected memory was not retrieved'
              print('OpenViking ingest and recall: OK')
          finally:
              memory.teardown()
          PY
      - name: Run a small scored benchmark
        run: |
          .venv/bin/amb datasets pull locomo
          .venv/bin/amb run \
            --system openviking --dataset locomo \
            --model openai:gpt-6-luna --judge --judge-model openai:gpt-6-luna \
            --llm openai:gpt-6-luna --embedding openai:text-embedding-3-small \
            --limit 1 --turns 40 --questions 3 --workers 1
          python - <<'PY'
          import json
          from pathlib import Path

          runs = sorted(Path('runs/locomo/openviking').glob('*/summary.json'))
          if len(runs) != 1:
              raise SystemExit(f'Expected one smoke run, found {len(runs)}')
          summary = json.loads(runs[0].read_text())
          rows = [json.loads(line) for line in (runs[0].parent / 'results.jsonl').read_text().splitlines()]
          if summary.get('errors') or len(rows) != 3 or any(row.get('judge_correct') is None for row in rows):
              raise SystemExit('Smoke benchmark contains errors or unjudged answers')
          for row in rows:
              print(json.dumps({key: row.get(key) for key in ('question_id', 'question', 'gold_answer', 'predicted_answer', 'num_hits', 'judge_correct')}))
          print('Three answers completed and were judged')
          PY
      - name: Save smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openviking-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/locomo/openviking/
            ${{ runner.temp }}/runner-info.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated server
        if: always()
        run: docker rm -f amb-openviking || true
